<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio-Palette Widget</title>
<style>
  :root {
    --bg: #0b0f12;
    --card: #13181e;
    --text: #f0f4f8;
    --muted: #8a99a8;
    --border: #222d38;
    --accent: #10b981;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
    max-width: 900px;
  }
  @media(max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 24px;
    border-radius: 16px;
  }
  h2 { margin: 0 0 4px 0; font-size: 1.1rem; }
  p { margin: 0 0 16px 0; color: var(--muted); font-size: 0.8rem; }
  select {
    width: 100%;
    padding: 12px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    margin-bottom: 20px;
  }
  .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 700;
  }
  .strip {
    display: flex;
    height: 80px;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .bar { flex: 1; }

  .match-header-box {
    height: 45px; /* Adjusts to match your select element height + padding */
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-bottom: 20px; /* Matches the select's margin-bottom */
  }
  .panel .match-title {
    margin: 0; /* Remove old spacing inside the title */
  }

  .match-title { color: var(--accent); font-weight: 600; margin-bottom: 16px; font-size: 0.95rem; }
  .wiki-box {
    width: 100%;
    aspect-ratio: 1 / 1;  /* Forces the height to match the width automatically */
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    position: relative;
  }
  .wiki-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  .wiki-box span {
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="grid">
  <!-- Primary Panel -->
  <div class="panel">
    <h2>Ecoregion Profiles</h2>
    <p>Select a city</p>
    <select id="sel"></select>
    
    <div class="label">Flora Palette</div>
    <div id="p-flora" class="strip"></div>
    
    <div class="label">Soil Profile</div>
    <div id="p-soil" class="strip"></div>
    <div class="wiki-box">
      <img id="p-wiki-img" alt="Selected city view">
      <span id="p-wiki-load">Loading image...</span>
    </div>
  </div>

  <!-- Closest Match Panel -->
  <div class="panel">
    <h2>Chromatic Harmony</h2>
    <p>Closest visual match</p>
    <div class="match-header-box">
      <div id="match-name" class="match-title">Select a city...</div>
    </div>
    
    <div class="label">Matched Flora</div>
    <div id="m-flora" class="strip"></div>
    
    <div class="label">Matched Soil</div>
    <div id="m-soil" class="strip"></div>
    <div class="wiki-box">
      <img id="m-wiki-img" alt="Matched city view">
      <span id="m-wiki-load">Awaiting match...</span>
    </div>
  </div>

</div>

  {id:"xia", n:"Xi'an, CN", f:["#2e4a38","#537d65","#d4a373"], s:["#8a735c","#5c4d3e"], match:"sheff", file:"Changle Gate of the Ming Dynasty City Wall in Xi'an.jpg"},
  {id:"yan", n:"Yantai, CN", f:["#134611","#2e735d","#52b788"], s:["#6b5a4d","#453a32"], match:"por", file:"Yantai Golden Beach Seaside Park.jpg"},
  {id:"yang", n:"Yangzhou, CN", f:["#2e5a36","#368a62","#b5c99a"], s:["#4d4239","#332b25"], match:"ely", file:"Thin West Lake south entrance.JPG"},
  {id:"zhanj", n:"Zhanjiang, CN", f:["#163319","#2d9c6d","#06d6a0"], s:["#754332","#4a2b20"], match:"sun", file:"Zhanjiang Bay Bridge.jpg"},
  {id:"zheng", n:"Zhengzhou, CN", f:["#2a4d38","#4c8563","#c7b198"], s:["#806a54","#544738"], match:"sou", file:"Zhengzhou City Museum.jpg"},
  {id:"zhenjiang", n:"Zhenjiang, CN", f:["#2b593f","#388a62","#ffb703"], s:["#7a4a36","#523225"], match:"sal", file:"Zhenjiang Jinshan.jpg"},
  {id:"zhous", n:"Zhoushan, CN", f:["#1c402e","#2e735d","#90e0ef"], s:["#6b4c35","#473223"], match:"rip", file:"Zhoushan New Town Skyline.jpg"},
  {id:"zhuh", n:"Zhuhai, CN", f:["#183a1d","#2d9c6d","#00b4d8"], s:["#754332","#4a2b20"], match:"don-uk", file:"Zhuhai Overview 201306.jpg"}
];

const sel = document.getElementById('sel');

// Fill dropdown
db.forEach(c => {
  let opt = document.createElement('option');
  opt.value = c.id;
  opt.textContent = c.n;
  sel.appendChild(opt);
});

function render(id) {
  const current = db.find(x => x.id === id);
  if (!current) return;
  const bestMatch = db.find(x => x.id === current.match) || db;

  // The unbreakable array-joined URL stitcher
  function getImg(file) {
    if (!file) return "";
    const filename = file.split('/').pop();
    const parts = ["https://commons", ".wikimedia", ".org/wiki/", "Special:FilePath/", filename];
    return parts.join("");
  }

  // Primary City Image
  const pImg = document.getElementById('p-wiki-img');
  const pLoad = document.getElementById('p-wiki-load');
  if (current.file) {
    const pUrl = getImg(current.file);
    pImg.style.display = 'block';
    pLoad.style.display = 'none';
    
    pImg.onerror = function() {
      pImg.style.display = 'none';
      pLoad.style.display = 'block';
      pLoad.style.fontSize = '0.55rem';
      pLoad.style.wordBreak = 'break-all';
      pLoad.style.padding = '8px';
      pLoad.innerText = `Failed: ${pUrl}`;
    };
    pImg.src = pUrl;
  } else {
    pImg.style.display = 'none';
    pLoad.style.display = 'block';
    pLoad.innerText = 'No image file provided';
  }

  // Matched City Image
  const mImg = document.getElementById('m-wiki-img');
  const mLoad = document.getElementById('m-wiki-load');
  if (bestMatch.file) {
    const mUrl = getImg(bestMatch.file);
    mImg.style.display = 'block';
    mLoad.style.display = 'none';
    
    mImg.onerror = function() {
      mImg.style.display = 'none';
      mLoad.style.display = 'block';
      mLoad.style.fontSize = '0.55rem';
      mLoad.style.wordBreak = 'break-all';
      mLoad.style.padding = '8px';
      mLoad.innerText = `Failed: ${mUrl}`;
    };
    mImg.src = mUrl;
  } else {
    mImg.style.display = 'none';
    mLoad.style.display = 'block';
    mLoad.innerText = 'No image file provided';
  }

  // Palette rendering...
  document.getElementById('p-flora').innerHTML = current.f.map(c => `<div class='bar' style='background:${c}'></div>`).join('');
  document.getElementById('p-soil').innerHTML = current.s.map(c => `<div class='bar' style='background:${c}'></div>`).join('');
  
  document.getElementById('match-name').innerText = `Partner Match: ${bestMatch.n}`;
  document.getElementById('m-flora').innerHTML = bestMatch.f.map(c => `<div class='bar' style='background:${c}'></div>`).join('');
  document.getElementById('m-soil').innerHTML = bestMatch.s.map(c => `<div class='bar' style='background:${c}'></div>`).join('');
}

// Listen for selection changes
sel.onchange = (e) => render(e.target.value);

// Run on start
render(db.id);
// 3. TRIGGER INITIAL RENDER ON PAGE LOAD (Add this line!)
if (db.length > 0) {
  render(db.id); // Automatically renders Aberdeen (or whichever is first)
}

</script>
