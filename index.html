<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio-Palette Widget</title>
<style>
  :root {
    --bg: #0b0f12;
    --card: #13181e;
    --text: #f0f4f8;
    --muted: #8a99a8;
    --border: #222d38;
    --accent: #10b981;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
    max-width: 900px;
  }
  @media(max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 24px;
    border-radius: 16px;
  }
  h2 { margin: 0 0 4px 0; font-size: 1.1rem; }
  p { margin: 0 0 16px 0; color: var(--muted); font-size: 0.8rem; }
  select {
    width: 100%;
    padding: 12px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    margin-bottom: 20px;
  }
  .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 700;
  }
  .strip {
    display: flex;
    height: 80px;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .bar { flex: 1; }
  .match-title { color: var(--accent); font-weight: 600; margin-bottom: 16px; font-size: 0.95rem; }
  .wiki-box {
    width: 100%;
    height: 120px;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    position: relative;
  }
  .wiki-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  .wiki-box span {
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="grid">
  <!-- Primary Panel -->
  <div class="panel">
    <h2>Ecoregion Profiles</h2>
    <p>Select a city</p>
    <select id="sel"></select>
    
    <div class="label">Flora Palette</div>
    <div id="p-flora" class="strip"></div>
    
    <div class="label">Soil Profile</div>
    <div id="p-soil" class="strip"></div>
    <div class="wiki-box">
      <img id="p-wiki-img" alt="Selected city view">
      <span id="p-wiki-load">Loading image...</span>
    </div>
  </div>

  <!-- Closest Match Panel -->
  <div class="panel">
    <h2>Chromatic Harmony</h2>
    <p>Closest visual match</p>
    <div id="match-name" class="match-title">Select a city...</div>
    
    <div class="label">Matched Flora</div>
    <div id="m-flora" class="strip"></div>
    
    <div class="label">Matched Soil</div>
    <div id="m-soil" class="strip"></div>
    <div class="wiki-box">
      <img id="m-wiki-img" alt="Matched city view">
      <span id="m-wiki-load">Awaiting match...</span>
    </div>
  </div>
</div>

async function fetchWikiImg(wikiSlug, imgId, loadId) {
  const img = document.getElementById(imgId);
  const load = document.getElementById(loadId);
  
  img.style.display = 'none';
  load.style.display = 'block';
  load.innerText = 'Loading image...';

  if (!wikiSlug) {
    load.innerText = 'No image link';
    return;
  }

  // Define the URL explicitly so we can log or display it
  const url = `https://wikipedia.org{encodeURIComponent(wikiSlug)}`;

  try {
    let res = await fetch(url, {
      headers: {
        'Api-User-Agent': 'BioPaletteWidget/1.0 (Educational Project)'
      }
    });
    
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    let json = await res.json();
    if (json.thumbnail && json.thumbnail.source) {
      img.src = json.thumbnail.source;
      img.style.display = 'block';
      load.style.display = 'none';
    } else {
      load.innerText = `No image found (${url})`;
    }
  } catch(e) {
    // This will print the exact URL that failed directly in the UI box
    load.style.fontSize = '0.65rem'; // Shrink text slightly to fit long URLs
    load.innerText = `Failed: ${url}`;
  }
}

async function render(id) {
  const current = db.find(x => x.id === id);
  if (!current) return;
  const bestMatch = db.find(x => x.id === current.match) || db;

  // Trigger both Wikipedia fetches in parallel
  fetchWikiImg(current.wiki, 'p-wiki-img', 'p-wiki-load');
  fetchWikiImg(bestMatch.wiki, 'm-wiki-img', 'm-wiki-load');

  // Draw Primary City Palettes
  document.getElementById('p-flora').innerHTML = current.f.map(c => `<div class='bar' style='background:${c}'></div>`).join('');
  document.getElementById('p-soil').innerHTML = current.s.map(c => `<div class='bar' style='background:${c}'></div>`).join('');
  
  // Draw Matched City Palettes
  document.getElementById('match-name').innerText = `Partner Match: ${bestMatch.n}`;
  document.getElementById('m-flora').innerHTML = bestMatch.f.map(c => `<div class='bar' style='background:${c}'></div>`).join('');
  document.getElementById('m-soil').innerHTML = bestMatch.s.map(c => `<div class='bar' style='background:${c}'></div>`).join('');
}

// Listen for selection changes
sel.onchange = (e) => render(e.target.value);

// Run on start
render(db.id);
</script>
</body>
</html>
